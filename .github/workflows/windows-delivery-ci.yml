name: Windows Delivery CI

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Upload the validated package to the R2.2.20 draft release"
        required: true
        type: boolean
        default: false
      source_sha:
        description: "Frozen software source commit to checkout"
        required: true
        type: string
        default: "571a5a611eb85b6a19575c2aad14253feae50237"
  push:
    branches:
      - fix/r1.3-customer-delivery-final
      - fix/r2.2.20-image-export-e2e

permissions:
  contents: write

concurrency:
  group: windows-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-delivery:
    name: Windows delivery validation
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || '571a5a611eb85b6a19575c2aad14253feae50237' }}

      - name: Verify branch, commit and freeze tag
        id: git_verify
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-ci | Out-Null
          $ErrorActionPreference = "Stop"
          $head = git rev-parse HEAD
          $expected = "${{ inputs.source_sha || '571a5a611eb85b6a19575c2aad14253feae50237' }}"
          $freeze = git rev-parse "freeze-r1.2-before-research-fix^{}"
          @(
            "head=$head"
            "expected=$expected"
            "freeze_peeled=$freeze"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/git-state.txt
          if ($head -ne $expected) {
            throw "SOURCE_COMMIT_MISMATCH: expected=$expected actual=$head"
          }
          if ($freeze -ne "0f827b4e54f8018a0cbdf71cabfca60c07f10c18") {
            throw "FREEZE_TAG_MISMATCH: $freeze"
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify repository .NET 8 SDK selection
        id: dotnet_verify
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $dotnetPath = (Get-Command dotnet).Source
          $resolved = dotnet --version
          $installed = dotnet --list-sdks
          @(
            "dotnet_path=$dotnetPath"
            "resolved_sdk=$resolved"
            "installed_sdks:"
            $installed
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/dotnet-sdk.txt
          if ($resolved -ne "8.0.423") { throw "DOTNET_8_SDK_RESOLUTION_FAILED: resolved=$resolved" }

      - name: Install Inno Setup
        id: inno_install
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $fallback = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $fallback)) {
              throw "INNO_SETUP_NOT_FOUND"
            }
          }

      - name: Install Python dependencies
        id: dependencies
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-runtime.txt
          python -m pip install pytest packaging
          python -m pip check 2>&1 | Tee-Object -FilePath artifacts/windows-ci/pip-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Windows environment
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-ci | Out-Null
          @(
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "github_sha=$env:GITHUB_SHA"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          python --version 2>&1 | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          python -c "import sys,site,platform; print('executable='+sys.executable); print('base_prefix='+sys.base_prefix); print('site_packages='+site.getsitepackages()[0]); print('platform='+platform.platform())" | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          dotnet --info 2>&1 | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          Get-Command ISCC.exe -ErrorAction SilentlyContinue | Format-List * | Out-String | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt

      - name: Compile Python sources
        id: compileall
        shell: pwsh
        continue-on-error: true
        run: |
          python -m compileall providers generation modules ui hot_sources export research 2>&1 | Tee-Object -FilePath artifacts/windows-ci/compileall.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete Windows test suite
        id: full_tests
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest -q --tb=short --junitxml=artifacts/windows-ci/pytest-windows.xml 2>&1 | Tee-Object -FilePath artifacts/windows-ci/pytest-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run security scan
        id: security_scan
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/security_scan.py 2>&1 | Tee-Object -FilePath artifacts/windows-ci/security-scan.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit and build native launcher
        id: launcher_build
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $ignored = "\\.venv\\|\\runtime\\|\\site-packages\\|\\release\\|\\dist\\|\\build\\"
          $projects = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj | Where-Object { $_.FullName -notmatch $ignored })
          $solutions = @(Get-ChildItem -Path . -Recurse -File -Filter *.sln | Where-Object { $_.FullName -notmatch $ignored })
          $sources = @(Get-ChildItem -Path . -Recurse -File -Filter *.cs | Where-Object { $_.FullName -notmatch $ignored })
          @(
            "csproj_count=$($projects.Count)"
            "sln_count=$($solutions.Count)"
            "cs_source_count=$($sources.Count)"
            "projects=$($projects.FullName -join ';')"
            "solutions=$($solutions.FullName -join ';')"
            "sources=$($sources.FullName -join ';')"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/launcher-inventory.txt
          if ($projects.Count -eq 0 -and $solutions.Count -eq 0) {
            throw "NATIVE_LAUNCHER_SOURCE_NOT_REPRODUCIBLE: no .csproj or .sln found"
          }
          if ($solutions.Count -gt 0) {
            foreach ($solution in $solutions) {
              dotnet restore $solution.FullName
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_RESTORE_FAILED: $($solution.FullName)" }
              dotnet build $solution.FullName --configuration Release --no-restore
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_BUILD_FAILED: $($solution.FullName)" }
            }
          } else {
            foreach ($project in $projects) {
              dotnet restore $project.FullName
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_RESTORE_FAILED: $($project.FullName)" }
              dotnet build $project.FullName --configuration Release --no-restore
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_BUILD_FAILED: $($project.FullName)" }
            }
          }
          Get-ChildItem -Path . -Recurse -File -Include *.exe,*.dll |
            Where-Object { $_.FullName -match "\\bin\\Release\\" } |
            Select-Object FullName,Length,LastWriteTimeUtc |
            Format-Table -AutoSize | Out-String |
            Set-Content -Encoding UTF8 artifacts/windows-ci/launcher-build-products.txt

      - name: Build portable Windows packages
        id: portable_package
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force data/logs | Out-Null
          "Windows GitHub Actions delivery validation" | Set-Content -Encoding UTF8 data/logs/windows_ci_report.txt
          $env:HOTSPOT_RUNTIME_SOURCE = python -c "import sys; print(sys.base_prefix)"
          $env:HOTSPOT_RUNTIME_SITE_PACKAGES = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $env:RC1_PACKAGE_PREFIX = "hotspot-article-agent-windows-ci"
          @(
            "HOTSPOT_RUNTIME_SOURCE=$env:HOTSPOT_RUNTIME_SOURCE"
            "HOTSPOT_RUNTIME_SITE_PACKAGES=$env:HOTSPOT_RUNTIME_SITE_PACKAGES"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/runtime-source.txt
          python scripts/package_rc1.py --report data/logs/windows_ci_report.txt 2>&1 | Tee-Object -FilePath artifacts/windows-ci/package-rc1.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate Windows delivery package
        id: package_build
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:HOTSPOT_RUNTIME_SOURCE = python -c "import sys; print(sys.base_prefix)"
          $env:HOTSPOT_RUNTIME_SITE_PACKAGES = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $webview = "packaging/assets/MicrosoftEdgeWebView2Setup.exe"
          New-Item -ItemType Directory -Force (Split-Path $webview) | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webview
          $signature = [System.IO.File]::ReadAllBytes($webview)[0..1]
          if ($signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) {
            throw "WEBVIEW2_BOOTSTRAPPER_INVALID"
          }
          Get-FileHash -Algorithm SHA256 $webview |
            Format-List | Out-String |
            Set-Content -Encoding UTF8 artifacts/windows-ci/webview2-bootstrapper.txt
          python scripts/build_rc1_3_3_lite_r2_2_7.py 2>&1 | Tee-Object -FilePath artifacts/windows-ci/inno-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setups = @(Get-ChildItem -Path . -File -Filter *_Setup.exe)
          $setups.FullName | Set-Content -Encoding UTF8 artifacts/windows-ci/inno-products.txt
          if ($setups.Count -eq 0) {
            throw "INNO_SETUP_OUTPUT_NOT_FOUND"
          }

      - name: Inventory generated artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -File -Include *.exe,*.msi,*.zip,*-manifest.json,*.iss |
            Where-Object { $_.FullName -notmatch "\\.venv\\|\\runtime\\|\\site-packages\\|\\.git\\" } |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
              "{0}`t{1}`t{2}" -f $_.FullName,$_.Length,$hash
            } | Set-Content -Encoding UTF8 artifacts/windows-ci/generated-artifacts.txt

      - name: Evaluate Windows delivery gates
        id: final_gate
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            git_verify = "${{ steps.git_verify.outcome }}"
            inno_install = "${{ steps.inno_install.outcome }}"
            dependencies = "${{ steps.dependencies.outcome }}"
            dotnet_sdk = "${{ steps.dotnet_verify.outcome }}"
            compileall = "${{ steps.compileall.outcome }}"
            full_tests = "${{ steps.full_tests.outcome }}"
            security_scan = "${{ steps.security_scan.outcome }}"
            launcher_build = "${{ steps.launcher_build.outcome }}"
            portable_package = "${{ steps.portable_package.outcome }}"
            package_build = "${{ steps.package_build.outcome }}"
          }
          $results.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Set-Content -Encoding UTF8 artifacts/windows-ci/gate-results.txt
          $failures = @($results.GetEnumerator() | Where-Object { $_.Value -ne "success" } | ForEach-Object { $_.Key })
          if ($failures.Count -gt 0) {
            throw "WINDOWS_DELIVERY_CI_FAILED: $($failures -join ', ')"
          }

      - name: Prepare Draft Release assets
        id: release_assets
        if: ${{ (inputs.draft_release == true || contains(github.event.head_commit.message, '[draft-release]')) && steps.final_gate.outcome == 'success' }}
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha || '571a5a611eb85b6a19575c2aad14253feae50237' }}
          RELEASE_TAG: r2.2.20-retest-571a5a61
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Path . -Recurse -File -Filter "热点图文批量生产工作台_RC1.3.3-Lite-R2.2.20_Setup.exe" | Select-Object -First 1
          $runtime = Get-ChildItem -Path . -Recurse -File -Filter "热点图文批量生产工作台_RC1.3.3-Lite-R2.2.20_Windows运行包.zip" | Select-Object -First 1
          $customer = Get-ChildItem -Path . -Recurse -File -Filter "热点图文批量生产工作台_RC1.3.3-Lite-R2.2.20*客户交付包.zip" | Select-Object -First 1
          foreach ($file in @($setup, $runtime, $customer)) {
            if (-not $file -or $file.Length -le 0) { throw "RELEASE_ASSET_MISSING_OR_EMPTY" }
          }
          $report = Join-Path (Get-Location) "WINDOWS_BUILD_TEST_REPORT.txt"
          Copy-Item artifacts/windows-ci/pytest-windows.txt $report -Force
          $sumLines = foreach ($file in @($setup, $runtime, $customer)) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $file.Name
          }
          $sumLines | Set-Content -Encoding UTF8 SHA256SUMS.txt
          $manifest = [ordered]@{
            release = "RC1.3.3-Lite-R2.2.20"
            release_tag = $env:RELEASE_TAG
            source_commit = $env:SOURCE_SHA
            branch = "fix/r2.2.20-image-export-e2e"
            artifacts = @(
              [ordered]@{ filename = $setup.Name; size = $setup.Length; sha256 = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant() }
              [ordered]@{ filename = $runtime.Name; size = $runtime.Length; sha256 = (Get-FileHash -Algorithm SHA256 $runtime.FullName).Hash.ToLowerInvariant() }
              [ordered]@{ filename = $customer.Name; size = $customer.Length; sha256 = (Get-FileHash -Algorithm SHA256 $customer.FullName).Hash.ToLowerInvariant() }
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 DELIVERY_MANIFEST.json
          @("setup=$($setup.FullName)", "runtime=$($runtime.FullName)", "customer=$($customer.FullName)") | Set-Content -Encoding UTF8 artifacts/windows-ci/release-assets.txt

      - name: Create or update Draft Release and upload assets
        id: draft_release_upload
        if: ${{ (inputs.draft_release == true || contains(github.event.head_commit.message, '[draft-release]')) && steps.release_assets.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: r2.2.20-retest-571a5a61
          SOURCE_SHA: ${{ inputs.source_sha || '571a5a611eb85b6a19575c2aad14253feae50237' }}
          RELEASE_TITLE: RC1.3.3-Lite-R2.2.20 Windows 用户复测包
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:SOURCE_SHA --draft --prerelease --title $env:RELEASE_TITLE --notes "Draft Windows user retest package. Built from $env:SOURCE_SHA. Not approved for customer delivery."
          } else {
            gh release edit $env:RELEASE_TAG --draft --prerelease --title $env:RELEASE_TITLE --notes "Draft Windows user retest package. Built from $env:SOURCE_SHA. Not approved for customer delivery."
          }
          $setup = (Get-Content artifacts/windows-ci/release-assets.txt | Where-Object { $_ -like "setup=*" }).Substring(6)
          $runtime = (Get-Content artifacts/windows-ci/release-assets.txt | Where-Object { $_ -like "runtime=*" }).Substring(8)
          $customer = (Get-Content artifacts/windows-ci/release-assets.txt | Where-Object { $_ -like "customer=*" }).Substring(9)
          gh release upload $env:RELEASE_TAG $setup $runtime $customer SHA256SUMS.txt DELIVERY_MANIFEST.json WINDOWS_BUILD_TEST_REPORT.txt --clobber

      - name: Download and verify Draft Release assets
        id: draft_release_download_verify
        if: ${{ (inputs.draft_release == true || contains(github.event.head_commit.message, '[draft-release]')) && steps.draft_release_upload.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: r2.2.20-retest-571a5a61
          SOURCE_SHA: ${{ inputs.source_sha || '571a5a611eb85b6a19575c2aad14253feae50237' }}
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path (Get-Location) "release-download"
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download $env:RELEASE_TAG --dir $download
          $expected = @(
  "_RC1.3.3-Lite-R2.2.20_Setup.exe",
  "_RC1.3.3-Lite-R2.2.20_Windows.zip",
  "_RC1.3.3-Lite-R2.2.20_.zip",
            "SHA256SUMS.txt",
            "DELIVERY_MANIFEST.json",
            "WINDOWS_BUILD_TEST_REPORT.txt"
          )
          foreach ($name in $expected) {
            $path = Join-Path $download $name
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "RELEASE_DOWNLOAD_MISSING_OR_EMPTY: $name" }
          }
          $sums = Get-Content (Join-Path $download "SHA256SUMS.txt")
          foreach ($line in $sums) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $download $Matches[2])).Hash.ToLowerInvariant()
              if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "RELEASE_SHA256_MISMATCH: $($Matches[2])" }
            }
          }
          $manifest = Get-Content (Join-Path $download "DELIVERY_MANIFEST.json") -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:SOURCE_SHA) { throw "RELEASE_MANIFEST_SOURCE_MISMATCH" }
Expand-Archive -Path (Join-Path $download "_RC1.3.3-Lite-R2.2.20_Windows.zip") -DestinationPath (Join-Path $download "runtime-expanded") -Force
Expand-Archive -Path (Join-Path $download "_RC1.3.3-Lite-R2.2.20_.zip") -DestinationPath (Join-Path $download "customer-expanded") -Force
$process = Start-Process -FilePath (Join-Path $download "_RC1.3.3-Lite-R2.2.20_Setup.exe") -ArgumentList "/?" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "RELEASE_SETUP_START_FAILED: exit=$($process.ExitCode)" }
          @("PACKAGE_DOWNLOAD_VERIFIED=true", "source_commit=$env:SOURCE_SHA", "release_tag=$env:RELEASE_TAG") | Set-Content -Encoding UTF8 artifacts/windows-ci/release-download-verification.txt

      - name: Upload Windows diagnostic evidence
        if: ${{ always() && inputs.draft_release != true && !contains(github.event.head_commit.message, '[draft-release]') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-delivery-evidence-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/windows-ci/**
            data/logs/windows_ci_report.txt
            hotspot-article-agent-windows-ci-*.zip
            hotspot-article-agent-windows-ci-*-manifest.json
            rc1_3_2_package_output.json
            evidence/rc1-release/**
            **/bin/Release/**
            **/Output/**
            **/dist/**
