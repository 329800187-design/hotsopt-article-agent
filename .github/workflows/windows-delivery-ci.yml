name: Windows Delivery CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/r1.3-customer-delivery-final

permissions:
  contents: read

concurrency:
  group: windows-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-delivery:
    name: Windows delivery validation
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch, commit and freeze tag
        id: git_verify
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-ci | Out-Null
          $ErrorActionPreference = "Stop"
          $branch = git branch --show-current
          $head = git rev-parse HEAD
          $freeze = git rev-parse "freeze-r1.2-before-research-fix^{}"
          @(
            "branch=$branch"
            "head=$head"
            "freeze_peeled=$freeze"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/git-state.txt
          if ($branch -ne "fix/r1.3-customer-delivery-final") {
            throw "WRONG_BRANCH: $branch"
          }
          if ($freeze -ne "0f827b4e54f8018a0cbdf71cabfca60c07f10c18") {
            throw "FREEZE_TAG_MISMATCH: $freeze"
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        id: inno_install
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $fallback = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $fallback)) {
              throw "INNO_SETUP_NOT_FOUND"
            }
          }

      - name: Install Python dependencies
        id: dependencies
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-runtime.txt
          python -m pip install pytest packaging
          python -m pip check 2>&1 | Tee-Object -FilePath artifacts/windows-ci/pip-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Windows environment
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-ci | Out-Null
          @(
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "github_sha=$env:GITHUB_SHA"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          python --version 2>&1 | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          python -c "import sys,site,platform; print('executable='+sys.executable); print('base_prefix='+sys.base_prefix); print('site_packages='+site.getsitepackages()[0]); print('platform='+platform.platform())" | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          dotnet --info 2>&1 | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt
          Get-Command ISCC.exe -ErrorAction SilentlyContinue | Format-List * | Out-String | Add-Content -Encoding UTF8 artifacts/windows-ci/environment.txt

      - name: Compile Python sources
        id: compileall
        shell: pwsh
        continue-on-error: true
        run: |
          python -m compileall providers generation modules ui hot_sources export research 2>&1 | Tee-Object -FilePath artifacts/windows-ci/compileall.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete Windows test suite
        id: full_tests
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest -q --tb=short --junitxml=artifacts/windows-ci/pytest-windows.xml 2>&1 | Tee-Object -FilePath artifacts/windows-ci/pytest-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run security scan
        id: security_scan
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/security_scan.py 2>&1 | Tee-Object -FilePath artifacts/windows-ci/security-scan.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit and build native launcher
        id: launcher_build
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $ignored = "\\.venv\\|\\runtime\\|\\site-packages\\|\\release\\|\\dist\\|\\build\\"
          $projects = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj | Where-Object { $_.FullName -notmatch $ignored })
          $solutions = @(Get-ChildItem -Path . -Recurse -File -Filter *.sln | Where-Object { $_.FullName -notmatch $ignored })
          $sources = @(Get-ChildItem -Path . -Recurse -File -Filter *.cs | Where-Object { $_.FullName -notmatch $ignored })
          @(
            "csproj_count=$($projects.Count)"
            "sln_count=$($solutions.Count)"
            "cs_source_count=$($sources.Count)"
            "projects=$($projects.FullName -join ';')"
            "solutions=$($solutions.FullName -join ';')"
            "sources=$($sources.FullName -join ';')"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/launcher-inventory.txt
          if ($projects.Count -eq 0 -and $solutions.Count -eq 0) {
            throw "NATIVE_LAUNCHER_SOURCE_NOT_REPRODUCIBLE: no .csproj or .sln found"
          }
          if ($solutions.Count -gt 0) {
            foreach ($solution in $solutions) {
              dotnet restore $solution.FullName
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_RESTORE_FAILED: $($solution.FullName)" }
              dotnet build $solution.FullName --configuration Release --no-restore
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_BUILD_FAILED: $($solution.FullName)" }
            }
          } else {
            foreach ($project in $projects) {
              dotnet restore $project.FullName
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_RESTORE_FAILED: $($project.FullName)" }
              dotnet build $project.FullName --configuration Release --no-restore
              if ($LASTEXITCODE -ne 0) { throw "DOTNET_BUILD_FAILED: $($project.FullName)" }
            }
          }
          Get-ChildItem -Path . -Recurse -File -Include *.exe,*.dll |
            Where-Object { $_.FullName -match "\\bin\\Release\\" } |
            Select-Object FullName,Length,LastWriteTimeUtc |
            Format-Table -AutoSize | Out-String |
            Set-Content -Encoding UTF8 artifacts/windows-ci/launcher-build-products.txt

      - name: Build portable Windows packages
        id: portable_package
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force data/logs | Out-Null
          "Windows GitHub Actions delivery validation" | Set-Content -Encoding UTF8 data/logs/windows_ci_report.txt
          $env:HOTSPOT_RUNTIME_SOURCE = python -c "import sys; print(sys.base_prefix)"
          $env:HOTSPOT_RUNTIME_SITE_PACKAGES = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $env:RC1_PACKAGE_PREFIX = "hotspot-article-agent-windows-ci"
          @(
            "HOTSPOT_RUNTIME_SOURCE=$env:HOTSPOT_RUNTIME_SOURCE"
            "HOTSPOT_RUNTIME_SITE_PACKAGES=$env:HOTSPOT_RUNTIME_SITE_PACKAGES"
          ) | Set-Content -Encoding UTF8 artifacts/windows-ci/runtime-source.txt
          python scripts/package_rc1.py --report data/logs/windows_ci_report.txt 2>&1 | Tee-Object -FilePath artifacts/windows-ci/package-rc1.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Inno Setup installer
        id: inno_build
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $env:HOTSPOT_RUNTIME_SOURCE = python -c "import sys; print(sys.base_prefix)"
          $env:HOTSPOT_RUNTIME_SITE_PACKAGES = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          python scripts/build_rc1_3_3_lite_r2_2_7.py 2>&1 | Tee-Object -FilePath artifacts/windows-ci/inno-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setups = @(Get-ChildItem -Path . -File -Filter *_Setup.exe)
          $setups.FullName | Set-Content -Encoding UTF8 artifacts/windows-ci/inno-products.txt
          if ($setups.Count -eq 0) {
            throw "INNO_SETUP_OUTPUT_NOT_FOUND"
          }

      - name: Inventory generated artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -File -Include *.exe,*.msi,*.zip,*-manifest.json,*.iss |
            Where-Object { $_.FullName -notmatch "\\.venv\\|\\runtime\\|\\site-packages\\|\\.git\\" } |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
              "{0}`t{1}`t{2}" -f $_.FullName,$_.Length,$hash
            } | Set-Content -Encoding UTF8 artifacts/windows-ci/generated-artifacts.txt

      - name: Evaluate Windows delivery gates
        id: final_gate
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            git_verify = "${{ steps.git_verify.outcome }}"
            inno_install = "${{ steps.inno_install.outcome }}"
            dependencies = "${{ steps.dependencies.outcome }}"
            compileall = "${{ steps.compileall.outcome }}"
            full_tests = "${{ steps.full_tests.outcome }}"
            security_scan = "${{ steps.security_scan.outcome }}"
            launcher_build = "${{ steps.launcher_build.outcome }}"
            portable_package = "${{ steps.portable_package.outcome }}"
            inno_build = "${{ steps.inno_build.outcome }}"
          }
          $results.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Set-Content -Encoding UTF8 artifacts/windows-ci/gate-results.txt
          $failures = @($results.GetEnumerator() | Where-Object { $_.Value -ne "success" } | ForEach-Object { $_.Key })
          if ($failures.Count -gt 0) {
            throw "WINDOWS_DELIVERY_CI_FAILED: $($failures -join ', ')"
          }

      - name: Upload Windows diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-delivery-evidence-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/windows-ci/**
            data/logs/windows_ci_report.txt
            hotspot-article-agent-windows-ci-*.zip
            hotspot-article-agent-windows-ci-*-manifest.json
            rc1_3_2_package_output.json
            evidence/rc1-release/**
            **/bin/Release/**
            **/Output/**
            **/dist/**
